appId: com.eagle-animation.app
productName: Eagle Animation
#compression: maximum
nativeRebuilder: legacy

# Re-signs toucan-camera-server and every bundled third-party Mach-O library
# (Canon/Sony/Nikon SDKs, libgphoto2 plugins, ...) after packaging. Without this,
# dyld rejects some of them ("code signature invalid") and the server crashes on
# launch -> empty camera list on mac builds.
afterPack: ./scripts/sign-toucan-macos.js

directories:
  output: binaries
  buildResources: out

files:
  - package.json
  - out/**
  - "toucan-camera-server/bin/**"

asarUnpack:
  - "**/*.node"
  - "node_modules/@img/**"
  - "node_modules/sharp/**"
  - "toucan-camera-server/bin/**"

extraMetadata:
  main: out/main/index.js
  name: eagle-animation
  desktopName: eagle-animation.desktop

win:
  artifactName: Eagle-Animation-${version}-win.${ext}
  executableName: eagle-animation
  icon: out/renderer/favicon.ico
  target:
    - portable
    - zip

mac:
  x64ArchFiles: "**/{node_modules/@img,node_modules/ffmpeg-static,node_modules/sharp,toucan-camera-server/bin}/**"
  artifactName: Eagle-Animation-${version}-mac.${ext}
  executableName: Eagle Animation
  category: public.app-category.photography
  icon: out/renderer/icon-mac.icns
  extendInfo:
    NSMicrophoneUsageDescription: Please give us access to your microphone
    NSCameraUsageDescription: Please give us access to your camera
    NSCameraUseContinuityCameraDeviceType: true
    AVCaptureDeviceTypeContinuityCamera: true
    com.apple.security.device.audio-input: true
    com.apple.security.device.camera: true

linux:
  artifactName: Eagle-Animation-${version}-linux.${ext}
  executableName: eagle-animation
  syncDesktopName: true
  category: Photography
  synopsis: EagleAnimation is an awesome, free and open-source animation software.
  description: EagleAnimation is an awesome, free and open-source animation software.
  icon: out/renderer/icon.png
  desktop:
    entry:
      StartupWMClass: eagle-animation
  target:
    - deb
    - rpm
    - tar.gz
    - AppImage