name: Prepare build environment
description: Installs Node.js, the npm dependencies and the platform-specific extras shared by every build job.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'
  sharp:
    description: 'Platform to install the extra sharp prebuilds for: linux, darwin or none.'
    required: false
    default: 'none'
  apt-packages:
    description: Space-separated apt packages to install before building. Empty to skip.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Installing bundling dependencies
      if: ${{ inputs.apt-packages != '' }}
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: ${{ inputs.apt-packages }}
        version: 1.0

    - name: Install dependencies
      shell: bash
      run: npm i --force

    # sharp ships one prebuilt binary per platform/arch, and packaging for another
    # machine than the runner (or for a universal macOS build) needs them all.
    - name: Install dependencies (Sharp for Linux)
      if: ${{ inputs.sharp == 'linux' }}
      shell: bash
      run: npm install --cpu=x64 --os=linux sharp --force

    # npm prunes every other arch on each --cpu install, so universal builds name
    # both packages explicitly. The check fails the job rather than ship one arch.
    - name: Install dependencies (Sharp for macOS)
      if: ${{ inputs.sharp == 'darwin' }}
      shell: bash
      run: |
        sharp=$(node -p "require('./node_modules/sharp/package.json').version")
        libvips=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-libvips-darwin-x64']")
        npm install --no-save --force \
          "@img/sharp-darwin-x64@$sharp" "@img/sharp-libvips-darwin-x64@$libvips" \
          "@img/sharp-darwin-arm64@$sharp" "@img/sharp-libvips-darwin-arm64@$libvips"
        for pkg in sharp-darwin-x64 sharp-libvips-darwin-x64 sharp-darwin-arm64 sharp-libvips-darwin-arm64; do
          test -f "node_modules/@img/$pkg/package.json" || { echo "::error::Missing @img/$pkg"; exit 1; }
        done
