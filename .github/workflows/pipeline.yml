name: Eagle Animation - Build & package

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'dev'
      - 'feature/pipeline'

jobs:
  web:
    name: Eagle Animation for Web
    runs-on: ubuntu-26.04

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare

      - name: Packaging Web
        run: |
          echo "VITE_PUBLIC_URL=${{ secrets.RUN_PUBLIC_URL }}" >> .env
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archiving Web
        run: |
          mkdir -p binaries
          archive="$PWD/binaries/Eagle-Animation-$(node -p "require('./package.json').version")-web.zip"
          cd out/web && zip -qr "$archive" .

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-web
          path: binaries/Eagle-Animation-*
          retention-days: 7

  linux:
    name: Eagle Animation for Linux
    runs-on: ubuntu-26.04

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare
        with:
          sharp: linux
          apt-packages: flatpak flatpak-builder rpm

      - name: Packaging Linux
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-linux
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 7

  windows:
    name: Eagle Animation for Windows
    runs-on: windows-latest

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare

      - name: Packaging Windows
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-windows
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 7

  macos:
    name: Eagle Animation for macOS
    runs-on: macos-latest

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare
        with:
          sharp: darwin

      - name: Packaging macOS
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 7

  # Electron 37 still runs on macOS 11/12, which Electron 44 dropped.
  macos-legacy:
    name: Eagle Animation for macOS (Legacy)
    runs-on: macos-latest

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare
        with:
          sharp: darwin

      - name: Packaging macOS (legacy, macOS 11+)
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:mac:legacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-legacy
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 7

  android:
    name: Eagle Animation for Android
    runs-on: ubuntu-26.04

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Setup Bundletool
        run: wget https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -O bundletool.jar

      # Replace by npm ci when it will be fixed
      - name: Install dependencies
        run: |
          rm package-lock.json
          npm i --force

      - name: Build web bundle and copy it to the Android project
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate app version
        run: |
          node ./scripts/android-bump-version.js >> $GITHUB_ENV
          echo "artifact_name=Eagle-Animation-`node -p "require('./package.json').version"`-android" >> $GITHUB_ENV

      - name: Build AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew app:bundleRelease

      # Artifact names mirror the electron-builder ones (Eagle-Animation-${version}-<platform>.<ext>):
      #  - .aab  the signed bundle uploaded to the Play Store
      #  - .apk  the signed universal APK, for a manual install
      #  - .zip  the bundletool archive holding every per-device APK split
      - name: Sign release files
        run: |
          echo "${{ secrets.KS_KEY_B64 }}" | base64 -d > keystore.jks
          mkdir -p binaries
          cp android/app/build/outputs/bundle/release/*.aab binaries/${{ env.artifact_name }}.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -storepass "${{ secrets.KS_STORE_PASS }}" -keystore keystore.jks binaries/${{ env.artifact_name }}.aab "${{ secrets.KS_ALIAS }}" -keypass "${{ secrets.KS_ALIAS_PASS }}"
          java -jar bundletool.jar build-apks --bundle=binaries/${{ env.artifact_name }}.aab --output=binaries/splits.apks --ks=keystore.jks --ks-pass=pass:"${{ secrets.KS_STORE_PASS }}" --ks-key-alias="${{ secrets.KS_ALIAS }}" --key-pass=pass:"${{ secrets.KS_ALIAS_PASS }}"
          java -jar bundletool.jar build-apks --bundle=binaries/${{ env.artifact_name }}.aab --output=binaries/universal.apks --mode=universal --ks=keystore.jks --ks-pass=pass:"${{ secrets.KS_STORE_PASS }}" --ks-key-alias="${{ secrets.KS_ALIAS }}" --key-pass=pass:"${{ secrets.KS_ALIAS_PASS }}"
          unzip -p binaries/universal.apks universal.apk > binaries/${{ env.artifact_name }}.apk
          mv binaries/splits.apks binaries/${{ env.artifact_name }}.zip
          rm binaries/universal.apks keystore.jks

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-android
          path: binaries/Eagle-Animation-*
          retention-days: 7

  # Single place where the release assets are attached: every build job only
  # uploads its own artifacts, this one collects them and pushes the whole set.
  release:
    name: Attach artifacts to the release
    runs-on: ubuntu-26.04
    needs:
      - web
      - linux
      - windows
      - macos
      - macos-legacy
      - android

    permissions:
      contents: write

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          path: binaries
          pattern: artifacts-*
          merge-multiple: true

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --notes ""
          fi
          gh release upload "$tag" binaries/Eagle-Animation-* --clobber

  # Platform publications run once the whole set of artifacts is attached to the
  # release, and only from master.
  publish-web:
    name: Publish (Web)
    runs-on: ubuntu-26.04
    needs: release
    if: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Download the Web bundle
        uses: actions/download-artifact@v8
        with:
          name: artifacts-web
          path: binaries

      - name: Unpacking the Web bundle
        run: unzip -q binaries/Eagle-Animation-*-web.zip -d out/web

      - name: Install and configure rclone
        run: |
          echo "${{ secrets.RCLONE_CONFIG }}" > /tmp/rclone.conf
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      # index.html and sw.js are copied last, so the shell is never served while
      # the assets it references are still missing.
      - name: Upload assets to Cloudflare
        run: |
          mv out/web/index.html ./
          mv out/web/sw.js ./ || true
          rclone --config /tmp/rclone.conf copy out/web/ backblaze:/eagle-app/
          rclone --config /tmp/rclone.conf copy index.html backblaze:/eagle-app/
          rclone --config /tmp/rclone.conf copy sw.js backblaze:/eagle-app/ || true

  publish-android:
    name: Publish (Android)
    runs-on: ubuntu-26.04
    needs: release
    if: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Download the Android bundle
        uses: actions/download-artifact@v8
        with:
          name: artifacts-android
          path: binaries

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PUBLISH_SERVICE_ACCOUNT }}
          packageName: com.brickabrack.eagleanimation
          releaseFiles: binaries/Eagle-Animation-*-android.aab
          track: production
