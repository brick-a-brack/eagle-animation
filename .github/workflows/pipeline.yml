name: Eagle Animation - Build & package

on:
  # A manual run can target a tag: the build then uses that tag's source and its
  # assets go to that tag's draft release instead of the current package.json one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (ex: v1.2.3), empty for the selected branch'
        required: false
        default: ''
  push:
    branches:
      - 'master'
      - 'dev'
      - 'feature/pipeline'

jobs:
  web:
    name: Eagle Animation for Web
    runs-on: ubuntu-26.04

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare

      - name: Packaging Web
        run: |
          echo "VITE_PUBLIC_URL=${{ secrets.RUN_PUBLIC_URL }}" >> .env
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archiving Web
        run: |
          mkdir -p binaries
          archive="$PWD/binaries/Eagle-Animation-$(node -p "require('./package.json').version")-web.zip"
          cd out/web && zip -qr "$archive" .

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-web
          path: binaries/Eagle-Animation-*
          retention-days: 1
          overwrite: true

  linux:
    name: Eagle Animation for Linux
    runs-on: ubuntu-26.04

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare
        with:
          sharp: linux
          apt-packages: flatpak flatpak-builder rpm

      - name: Packaging Linux
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-linux
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 1
          overwrite: true

  windows:
    name: Eagle Animation for Windows
    runs-on: windows-latest

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare

      - name: Packaging Windows
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-windows
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 1
          overwrite: true

  macos:
    name: Eagle Animation for macOS
    runs-on: macos-latest

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare
        with:
          sharp: darwin

      - name: Packaging macOS
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 1
          overwrite: true

  # Electron 37 still runs on macOS 11/12, which Electron 44 dropped.
  macos-legacy:
    name: Eagle Animation for macOS (Legacy)
    runs-on: macos-latest

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare
        with:
          sharp: darwin

      - name: Packaging macOS (legacy, macOS 11+)
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:mac:legacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-legacy
          path: |
            binaries/Eagle-Animation-*
            !binaries/*.blockmap
          retention-days: 1
          overwrite: true

  android:
    name: Eagle Animation for Android
    runs-on: ubuntu-26.04

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Setup Bundletool
        run: wget https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -O bundletool.jar

      # Replace by npm ci when it will be fixed
      - name: Install dependencies
        run: |
          rm package-lock.json
          npm i --force

      - name: Build web bundle and copy it to the Android project
        run: |
          echo "VITE_COMMIT_HASH=${{ github.sha }}" >> .env
          npm run build:android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate app version
        run: |
          node ./scripts/android-bump-version.js >> $GITHUB_ENV
          echo "artifact_name=Eagle-Animation-`node -p "require('./package.json').version"`-android" >> $GITHUB_ENV

      - name: Build AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew app:bundleRelease

      # Artifact names mirror the electron-builder ones (Eagle-Animation-${version}-<platform>.<ext>):
      #  - .aab  the signed bundle uploaded to the Play Store
      #  - .apk  the signed universal APK, for a manual install
      #  - .zip  the bundletool archive holding every per-device APK split
      - name: Sign release files
        run: |
          echo "${{ secrets.KS_KEY_B64 }}" | base64 -d > keystore.jks
          mkdir -p binaries
          cp android/app/build/outputs/bundle/release/*.aab binaries/${{ env.artifact_name }}.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -storepass "${{ secrets.KS_STORE_PASS }}" -keystore keystore.jks binaries/${{ env.artifact_name }}.aab "${{ secrets.KS_ALIAS }}" -keypass "${{ secrets.KS_ALIAS_PASS }}"
          java -jar bundletool.jar build-apks --bundle=binaries/${{ env.artifact_name }}.aab --output=binaries/splits.apks --ks=keystore.jks --ks-pass=pass:"${{ secrets.KS_STORE_PASS }}" --ks-key-alias="${{ secrets.KS_ALIAS }}" --key-pass=pass:"${{ secrets.KS_ALIAS_PASS }}"
          java -jar bundletool.jar build-apks --bundle=binaries/${{ env.artifact_name }}.aab --output=binaries/universal.apks --mode=universal --ks=keystore.jks --ks-pass=pass:"${{ secrets.KS_STORE_PASS }}" --ks-key-alias="${{ secrets.KS_ALIAS }}" --key-pass=pass:"${{ secrets.KS_ALIAS_PASS }}"
          unzip -p binaries/universal.apks universal.apk > binaries/${{ env.artifact_name }}.apk
          mv binaries/splits.apks binaries/${{ env.artifact_name }}.zip
          rm binaries/universal.apks keystore.jks

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-android
          path: binaries/Eagle-Animation-*
          retention-days: 1
          overwrite: true

  promo:
    name: Eagle Animation promo assets
    runs-on: ubuntu-26.04

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Prepare build environment
        uses: ./.github/actions/prepare

      # playwright-core ships no browser, and the CLI must match its version so
      # the download lands where playwright-core looks for it.
      - name: Install Chromium
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - name: Rendering promo assets
        run: npm run promo:assets

      - name: Archiving promo assets
        run: |
          mkdir -p binaries
          archive="$PWD/binaries/Eagle-Animation-$(node -p "require('./package.json').version")-promo.zip"
          cd out/promo && zip -qr "$archive" .

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-promo
          path: binaries/Eagle-Animation-*
          retention-days: 1
          overwrite: true

  # Gate between the builds and the publications: downstream jobs wait on this
  # one only, which keeps the dependency graph readable.
  builds:
    name: All builds succeeded
    runs-on: ubuntu-26.04
    needs:
      - web
      - linux
      - windows
      - macos
      - macos-legacy
      - android
      - promo

    steps:
      - name: Builds summary
        run: echo "Every build succeeded, moving on to the publications."

  # Tells the publication job whether there is somewhere to publish to, so the
  # job is skipped instead of failing when no draft release is waiting.
  release-check:
    name: Look for a draft release
    runs-on: ubuntu-26.04
    needs: builds

    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      found: ${{ steps.draft.outputs.found }}

    steps:
      - name: Clone source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # Assets are only ever attached to a draft release: a missing release or an
      # already published one is a no-op, never an error.
      - name: Check the release state
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="v$(node -p "require('./package.json').version")"
          state=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$state" = "true" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is a draft release, its assets will be attached."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            if [ "$state" = "missing" ]; then
              echo "::notice::No release for $tag, skipping the Github publication."
            else
              echo "::notice::$tag is already published, skipping the Github publication."
            fi
          fi

  # Single place where the release assets are attached: every build job only
  # uploads its own artifacts, this one collects them and pushes the whole set.
  release:
    name: Publish (Github)
    runs-on: ubuntu-26.04
    needs: release-check
    if: ${{ needs.release-check.outputs.found == 'true' }}

    permissions:
      contents: write

    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          path: binaries
          pattern: artifacts-*
          merge-multiple: true

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ needs.release-check.outputs.tag }}
        run: |
          # gh uploads the assets of one invocation concurrently: when a response
          # is lost it retries and collides with the asset it just created, and
          # --clobber only deletes what existed when the command started. One file
          # per invocation keeps each upload independently retryable, so --clobber
          # can clear the half-written asset left by a previous attempt.
          for file in binaries/Eagle-Animation-*; do
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$file" --clobber; then
                continue 2
              fi
              echo "::warning::Upload of $file failed (attempt $attempt/3)"
              sleep $((attempt * 5))
            done
            echo "::error::Unable to upload $file"
            exit 1
          done
