name: Eagle Animation - Publish

# The builds live in the build pipeline: here the assets of a published release
# are only downloaded and pushed to the platforms, never rebuilt.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose assets must be published (ex: v1.2.3)'
        required: true

jobs:
  # Pre-releases stay out of the stores, and a draft never reaches this workflow.
  target:
    name: Release to publish
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

    outputs:
      tag: ${{ steps.target.outputs.tag }}

    permissions:
      contents: read

    steps:
      - name: Resolve the release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          state=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$state" != "false" ]; then
            echo "::error::$tag is not a published release ($state), nothing to publish."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-web:
    name: Publish (Web)
    runs-on: ubuntu-26.04
    needs: target

    permissions:
      contents: read

    steps:
      - name: Download the Web bundle from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ needs.target.outputs.tag }}
        run: gh release download "$tag" --pattern 'Eagle-Animation-*-web.zip' --dir binaries

      - name: Unpacking the Web bundle
        run: unzip -q binaries/Eagle-Animation-*-web.zip -d out/web

      - name: Install and configure rclone
        run: |
          echo "${{ secrets.RCLONE_CONFIG }}" > /tmp/rclone.conf
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      # index.html and sw.js are copied last, so the shell is never served while
      # the assets it references are still missing.
      - name: Upload assets to Cloudflare
        run: |
          mv out/web/index.html ./
          mv out/web/sw.js ./ || true
          rclone --config /tmp/rclone.conf copy out/web/ backblaze:/eagle-app/
          rclone --config /tmp/rclone.conf copy index.html backblaze:/eagle-app/
          rclone --config /tmp/rclone.conf copy sw.js backblaze:/eagle-app/ || true

  publish-android:
    name: Publish (Android)
    runs-on: ubuntu-26.04
    needs: target

    permissions:
      contents: read

    steps:
      - name: Download the Android bundle from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          tag: ${{ needs.target.outputs.tag }}
        run: gh release download "$tag" --pattern 'Eagle-Animation-*-android.aab' --dir binaries

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PUBLISH_SERVICE_ACCOUNT }}
          packageName: com.brickabrack.eagleanimation
          releaseFiles: binaries/Eagle-Animation-*-android.aab
          track: production

  # Opens a PR on microsoft/winget-pkgs from the brick-a-brack fork.
  publish-winget:
    name: Publish (WinGet)
    runs-on: ubuntu-26.04
    needs: target

    permissions:
      contents: read

    steps:
      # The first version is submitted by hand: the action fails until it is merged.
      - name: Check if WinGet needs this version
        id: winget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.target.outputs.tag }}
        run: |
          base=repos/microsoft/winget-pkgs/contents/manifests/b/BrickABrack/EagleAnimation
          submit=true
          if ! versions=$(gh api "$base" --jq '.[].name' 2>gh-error.txt); then
            grep -q 'HTTP 404' gh-error.txt || { cat gh-error.txt; exit 1; }
            submit=false
            echo "::notice::The package is not on WinGet yet, skipping the submission."
          elif grep -Fxq "${tag#v}" <<< "$versions"; then
            submit=false
            echo "::notice::$tag is already on WinGet, skipping the submission."
          fi
          echo "submit=$submit" >> "$GITHUB_OUTPUT"

      # The regex excludes the portable build, which is not an installer.
      - name: Submit the installer to WinGet
        if: ${{ steps.winget.outputs.submit == 'true' }}
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: BrickABrack.EagleAnimation
          installers-regex: '-win-setup\.exe$'
          release-tag: ${{ needs.target.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
